<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button{font-family:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar{width:100%;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}

.hero{background:linear-gradient(160deg,#14144F,#1D1D63 60%,#262070);color:#fff;text-align:center;padding:38px 20px 96px;position:relative}
.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#00BF9C 0 25%,#63D654 25% 50%,#FCC242 50% 75%,#9B05B9 75%)}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.hero .k{color:#7EE8D2;font-size:13px;font-family:'Cairo',sans-serif;letter-spacing:.2px}

.stats{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(230,197,112,.45);border-radius:14px;padding:10px 24px;min-width:120px}

.tools{margin-top:-52px;position:relative;z-index:5}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(20,20,79,.1);padding:14px}

.search.has .x{display:flex}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;padding:10px 8px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:14px;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
main{flex:1;padding:22px 0 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px;text-align:right;font:inherit;color:inherit;position:relative}

.org .cnt{display:inline-flex;align-items:center;gap:6px;background:var(--gold-l);color:#00604F;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;align-self:flex-start}

.svc{cursor:default}
.svc h3{font-family:'Cairo',sans-serif;font-size:16px;line-height:1.6;margin:0;color:var(--navy);font-weight:800}
.svc .by{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--teal);font-weight:600;cursor:pointer;border:0;background:none;padding:0;text-align:right}
.svc .by svg.i{width:15px;height:15px}

.tags{display:flex;flex-wrap:wrap;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:11px;border:0;background:var(--navy2);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--navy)}.btn.gold{background:var(--gold);color:#241a05}.btn.gold:hover{background:#b8913f}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--navy2)}

.back{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--navy2);cursor:pointer;font-size:13.5px;margin-bottom:14px}

.orghead{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}

.filters{display:grid;gap:10px;margin-bottom:14px}
.filters select{padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font:500 14px inherit;font-family:inherit;background:#fff;width:100%;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--navy2);font-weight:600}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.chip.lnk{border:0;background:none;color:var(--teal);padding:6px 4px}
.empty{text-align:center;color:var(--gray);padding:44px 16px;background:#fff;border:1px dashed var(--line);border-radius:16px;line-height:2}
.det{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:860px;margin:0 auto 20px}
.det h1{font-family:'Cairo',sans-serif;font-size:clamp(20px,3.6vw,27px);line-height:1.6;margin:0 0 10px;color:var(--navy)}
.det .by{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--gold-l);color:#00604F;border-radius:999px;padding:6px 14px 6px 12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.det .lb{font-size:12.5px;color:var(--gray);font-weight:700;margin:20px 0 7px}
.det .ds{font-size:15.5px;line-height:2.15;color:#2B2B45;white-space:pre-wrap}
.cta{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.cta .btn{width:100%;padding:15px;font-size:16px}
.cta .u{direction:ltr;text-align:center;font-size:12px;color:var(--gray);margin-top:9px;overflow-wrap:anywhere}
.warn{background:#FFF4E0;border:1px solid #F1D29A;color:#7A4B00;border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.9;display:flex;gap:10px;align-items:flex-start}
.foot{padding:22px 16px 30px;text-align:center;font-size:12.5px;color:var(--gray)}

.modal{position:fixed;inset:0;background:rgba(20,20,79,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:380px;text-align:center}
.mbox h3{font-family:'Cairo',sans-serif;margin:0 0 4px;color:var(--navy)}.mbox p{font-size:13px;color:var(--gray);margin:0 0 12px}
.mbox canvas{width:240px;height:240px;border:1px solid var(--line);border-radius:12px;padding:8px;image-rendering:pixelated}
.mbox input{width:100%;margin:12px 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;direction:ltr;font-size:13px;font-family:inherit}
.mbox .row{display:flex;gap:8px}.mbox .row .btn{flex:1;padding:11px 8px;font-size:13.5px}
.cb-fab{position:fixed;left:16px;bottom:16px;z-index:40;background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:13px 18px;font:700 14.5px inherit;font-family:inherit;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 24px rgba(20,20,79,.35)}
.cb-fab:hover{background:var(--navy)}.cb-fab svg.i{width:20px;height:20px;color:#7EE8D2}
.cb{position:fixed;left:16px;bottom:16px;z-index:60;width:380px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 32px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(20,20,79,.3);display:none;flex-direction:column;overflow:hidden}
.cb.on{display:flex}
.cb-h{background:linear-gradient(160deg,#14144F,#1D1D63);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px}
.cb-h b{font-family:'Cairo',sans-serif;font-size:15px;flex:1}.cb-h small{display:block;font-weight:400;font-size:11.5px;color:#D9D8EE;font-family:inherit}
.cb-h button{background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb-m{flex:1;overflow:auto;padding:14px;background:#F7F7FB;display:flex;flex-direction:column;gap:10px}
.cb-b{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}
.cb-b.u{align-self:flex-start;background:var(--navy2);color:#fff;border-bottom-right-radius:4px}
.cb-b.a{align-self:flex-end;background:#fff;border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
.cb-b.n{align-self:center;background:var(--gold-l);color:#00604F;font-size:12px;max-width:96%;text-align:center;padding:6px 10px}
.cb-r{align-self:stretch;display:grid;gap:8px}
.cb-c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cb-c b{font-family:'Cairo',sans-serif;font-size:13.5px;color:var(--navy);display:block;line-height:1.6}.cb-c span{font-size:12px;color:var(--teal);display:block;margin:2px 0 8px}
.cb-c .row{display:flex;gap:6px}.cb-c .btn{padding:7px 12px;font-size:12.5px;border-radius:9px;flex:1}
.cb-s{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;background:#F7F7FB}
.cb-s button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 12.5px inherit;font-family:inherit;color:var(--navy2);cursor:pointer}
.cb-i{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.cb-i input{flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font:500 14.5px inherit;font-family:inherit;min-width:0}
.cb-i input:focus{outline:none;border-color:var(--navy2)}
.cb-i button{border:0;background:var(--gold);color:#241a05;border-radius:11px;padding:0 16px;font-weight:800;cursor:pointer;font-family:inherit}
.cb-i button:disabled{opacity:.5}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gray);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(max-width:560px){.cb{left:0;bottom:0;width:100vw;max-width:100vw;height:86vh;max-height:86vh;border-radius:18px 18px 0 0}.cb-fab{left:12px;bottom:12px;padding:12px 16px}}
svg.i.fill{fill:currentColor}
.lgbox{height:64px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px}

</style>

  .hero{padding:18px 16px 96px!important}.hero p{font-size:13px;line-height:1.75}.hero .k{font-size:12px}

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }

  $('#tagMore').addEventListener('click',()=>{ showAllTags=!showAllTags; render(); });
  const c = $('#fClear'); if(c) c.addEventListener('click',()=>{ F={org:'',tag:'',cat:''}; render(); });
  bind(view);
}
function viewService(id){
  const s = SBY[id], o = s && OBY[s.org];
  if(!s){ view.innerHTML = `<button class="back" data-back="#/">${ic('arrow-r')}العودة</button><div class="empty">الخدمة غير موجودة.</div>`; bind(view); return; }
  setTab(''); const t = s.tags||[];
  const apply = /برنامج/.test(s.title) ? 'التقديم على البرنامج' : 'الاستفادة من الخدمة';
  const more = SVCS.filter(x=>x.org===s.org && x.id!==s.id).slice(0,3);
  const cta = s.link ? `<a class="btn gold" href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">${apply} ${ic('ext')}</a><div class="u">${esc(s.raw||s.link)}</div>`
    : s.note ? `<div class="warn">${ic('info')}<div>للاستفادة من هذه الخدمة: <b>${esc(s.note)}</b></div></div>`
    : `<div class="warn">${ic('info')}<div>رابط الاستفادة غير متاح حالياً</div></div>`;
  view.innerHTML = `<button class="back" data-back="#/org/${esc(s.org)}">${ic('arrow-r')}العودة</button>
   <article class="det"><h1>${esc(s.title)}</h1><button class="by" data-org="${esc(s.org)}">${ic('building')}${esc(o.name)}</button>
   <div class="lb">وصف الخدمة</div><div class="ds">${esc(s.desc)}</div>
   ${t.length?`<div class="lb">الكلمات المفتاحية</div><div class="tags">${t.map(x=>`<button class="tag" data-tagjump="${esc(x)}">${ic('tag')}${esc(x)}</button>`).join('')}</div>`:''}
   <div class="cta">${cta}<button class="btn fvb ${isFav(s.id)?'on':''}" id="favBtn" style="width:100%">${ic('heart')}<span>${isFav(s.id)?'محفوظة في قائمتي':'حفظ في قائمتي'}</span></button></div></article>
   ${more.length?`<div class="sec-h"><h2>خدمات أخرى من الجهة</h2><span><button class="chip lnk" data-org="${esc(s.org)}">عرض الكل (${o.count})</button></span></div><div class="grid">${more.map(x=>svcCard(x,false)).join('')}</div>`:''}`;
  $('#favBtn').addEventListener('click',()=>{ toggleFav(s.id); const b=$('#favBtn'); b.classList.toggle('on',isFav(s.id)); b.querySelector('span').textContent=isFav(s.id)?'محفوظة في قائمتي':'حفظ في قائمتي'; });
  view.querySelectorAll('[data-tagjump]').forEach(b=>b.addEventListener('click',()=>{ F={org:'',cat:'',tag:b.dataset.tagjump}; Q=''; setQ(''); go('#/services'); }));
  bind(view);
}
function viewForYou(){
  setTab('foryou'); const st = STAGES.find(x=>x.id===FY.stage);
  let res = [];
  if(st || FY.needs.length){
    res = SVCS.map(s=>{ const c=s.cats||[]; const need=FY.needs.filter(n=>c.includes(n)).length, stg=st?st.cats.filter(n=>c.includes(n)).length:0;
      return { s, sc:(FY.needs.length&&!need)?-1:need*3+stg }; }).filter(x=>x.sc>0 || (!FY.needs.length && st && x.sc>0)).sort((a,b)=>b.sc-a.sc||a.s.id-b.s.id);
  }
  view.innerHTML = `<div class="sec-h"><h2>مقترح لك</h2><span>أجيبوا عن سؤالين لنرشّح لكم الخدمات الأنسب</span></div>
   <div class="step">1) في أي مرحلة مشروعكم؟ <small>(اختياري)</small></div>
   <div class="stages">${STAGES.map(x=>`<button class="stg ${FY.stage===x.id?'on':''}" data-stg="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></button>`).join('')}</div>
   <div class="step">2) ما نوع الدعم الذي تحتاجونه؟ <small>(يمكن اختيار أكثر من نوع)</small></div>
   <div class="chips" style="margin-bottom:10px">${CATS.map(c=>`<button class="chip ${FY.needs.includes(c.id)?'on':''}" data-need="${c.id}">${esc(c.name)}</button>`).join('')}${(st||FY.needs.length)?`<button class="chip lnk" id="fyClear">مسح الاختيار</button>`:''}</div>
   ${(st||FY.needs.length)?`<div class="sec-h" style="margin-top:18px"><h2>الخدمات المرشّحة</h2><span>${res.length} خدمة</span></div>${res.length?`<div class="grid">${res.map(x=>svcCard(x.s)).join('')}</div>`:`<div class="empty">لا توجد خدمات مطابقة لهذا الاختيار. جرّبوا تقليل الأنواع المختارة.</div>`}`:`<div class="empty">اختاروا مرحلة مشروعكم أو نوع الدعم لتظهر الخدمات المناسبة هنا.</div>`}`;
  view.querySelectorAll('[data-stg]').forEach(b=>b.addEventListener('click',()=>{ FY.stage = FY.stage===b.dataset.stg?'':b.dataset.stg; render(); }));
  view.querySelectorAll('[data-need]').forEach(b=>b.addEventListener('click',()=>{ const n=b.dataset.need; FY.needs = FY.needs.includes(n)?FY.needs.filter(x=>x!==n):FY.needs.concat(n); render(); }));
  const c=$('#fyClear'); if(c) c.addEventListener('click',()=>{ FY={stage:'',needs:[]}; render(); });
  bind(view);
}
function viewSaved(){
  setTab('saved'); const list = FAV.map(id=>SBY[id]).filter(Boolean);
  view.innerHTML = `<div class="sec-h"><h2>قائمتي</h2><span>${list.length} خدمة محفوظة على هذا الجهاز</span></div>`
   + (list.length?`<div class="bar"><button class="btn ghost" id="favCopy">${ic('copy')}نسخ القائمة</button><button class="btn ghost" id="favClr">${ic('x')}إفراغ القائمة</button></div><div class="grid">${list.map(s=>svcCard(s)).join('')}</div>`
     :`<div class="empty">لم تحفظوا أي خدمة بعد.<br>اضغطوا على أيقونة القلب في أي خدمة لتجدوها هنا لاحقًا.</div>`);
  const cp=$('#favCopy'); if(cp) cp.addEventListener('click',async()=>{ const txt=list.map(s=>`• ${s.title} — ${(OBY[s.org]||{}).name}\n  ${s.link||s.note||'رابط الاستفادة غير متاح حاليًا'}`).join('\n'); try{ await navigator.clipboard.writeText(txt); cp.lastChild.textContent='تم النسخ'; }catch(e){ prompt('انسخوا القائمة:',txt); } });
  const cl=$('#favClr'); if(cl) cl.addEventListener('click',()=>{ if(confirm('إفراغ قائمتي؟')){ FAV=[]; try{ localStorage.removeItem('pg_fav'); }catch(e){} updFav(); render(); } });
  bind(view);
}
function render(){
  const r = route();
  if(r.a==='foryou') viewForYou(); else if(r.a==='saved') viewSaved(); else if(r.a==='org') viewOrg(r.b); else if(r.a==='service') viewService(+r.b); else if(r.a==='services') viewServices(); else viewHome();
}
function setQ(v){ $('#q').value = v; $('#sbox').classList.toggle('has', !!v); }
let nav = 0; window.addEventListener('hashchange',()=>{ window.__navd = true; render(); window.scrollTo({top:0}); });
$('#q').addEventListener('input',e=>{ Q = e.target.value; $('#sbox').classList.toggle('has', !!Q); const r=route(); if(r.a==='service'||r.a==='foryou'||r.a==='saved'){ go('#/'); return; } render(); });
$('#qx').addEventListener('click',()=>{ Q=''; setQ(''); render(); $('#q').focus(); });
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go({home:'#/',services:'#/services',foryou:'#/foryou',saved:'#/saved'}[b.dataset.t])));
const toolsEl = document.querySelector('.tools'); const onScroll = ()=>toolsEl.classList.toggle('stuck', window.scrollY>260); window.addEventListener('scroll',onScroll,{passive:true});
/* QR */
const qm = $('#qrm');
function drawQR(){
  const url = $('#qrUrl').value.trim(), c = $('#qrc'), x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,240,240);
  if(!url||typeof qrcode==='undefined') return;
  const q = qrcode(0,'M'); q.addData(url); q.make(); const n = q.getModuleCount(), m = Math.floor(240/(n+2)), off = Math.floor((240-m*n)/2);
  x.fillStyle='#14144F'; for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) x.fillRect(off+k*m,off+r*m,m,m);
}
$('#qrBtn').addEventListener('click',()=>{ $('#qrUrl').value = location.href.split('#')[0]; qm.classList.add('on'); drawQR(); });
$('#qrUrl').addEventListener('input',drawQR);
$('#qrClose').addEventListener('click',()=>qm.classList.remove('on'));
qm.addEventListener('click',e=>{ if(e.target===qm) qm.classList.remove('on'); });
$('#qrDl').addEventListener('click',()=>{ const big=document.createElement('canvas'); big.width=big.height=1024; const g=big.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage($('#qrc'),0,0,1024,1024); const a=document.createElement('a'); a.href=big.toDataURL('image/png'); a.download='partners-guide-qr.png'; a.click(); });
render();

/* ===== مساعد الدليل ===== */
(function(){
  const cb=$('#cb'), M=$('#cbM'), S=$('#cbS'), F=$('#cbF'), I=$('#cbQ'), GO=$('#cbGo'); let HIST=[], busy=false, localMode=false, opened=false;
  const STOP=new Set('ما هي هو من في على الي الى عن مع او ان انا عندي لدي لدينا اريد ابي ابغي احتاج احتاجه كيف وش ايش هل يوجد توجد هذا هذه ذلك التي الذي كل بعض لو اذا ممكن يمكن ابحث اكثر مناسب يناسبني يناسب خدمه خدمات برنامج برامج جهه جهات مشروع مشروعي'.split(' '));
  const SYN={تمويل:'منح قروض دعم ماليه ضمان حوافز',منحه:'منح تمويل',قرض:'قروض تمويل',استثمار:'مستثمر مستثمرين راس مال',تدريب:'مهارات ورش تاهيل شهاده',سحابه:'aws سحابي حوسبه',سحابي:'aws حوسبه',ذكاء:'ai اصطناعي',تسويق:'عملاء مبيعات اسواق',تصدير:'توسع دولي عالمي',نموذج:'اوليه mvp نمذجه منتج',احتضان:'حاضنه تسريع مسرعه',ارشاد:'استشارات توجيه'};
  function tokens(q){ const out=new Set(); norm(q).replace(/[^؀-ۿa-z0-9+ ]/g,' ').split(' ').forEach(w=>{ if(w.length<2||STOP.has(w)) return; const b=w.replace(/^(وال|بال|لل|ال|و)(?=.{3,})/,''); out.add(b); Object.keys(SYN).forEach(k=>{ if(b.startsWith(k)||(k.startsWith(b)&&b.length>=3)) SYN[k].split(' ').forEach(x=>out.add(x)); }); }); return [...out]; }
  function retrieve(q,n){ const T=tokens(q); if(!T.length) return []; return SVCS.map(s=>{ const t=norm(s.title),g=norm((s.tags||[]).join(' ')),o=norm((OBY[s.org]||{}).name),d=norm(s.desc); let sc=0; T.forEach(w=>{ if(t.includes(w)) sc+=4; if(g.includes(w)) sc+=3; if(o.includes(w)) sc+=3; if(d.includes(w)) sc+=1; }); return {s,sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,n).map(x=>x.s); }
  const scroll=()=>{ M.scrollTop=M.scrollHeight; };
  function bubble(cls,txt){ const d=document.createElement('div'); d.className='cb-b '+cls; d.textContent=txt; M.appendChild(d); scroll(); return d; }
  function cards(ids){
    const list=ids.map(id=>SBY[id]).filter(Boolean); if(!list.length) return;
    const w=document.createElement('div'); w.className='cb-r';
    w.innerHTML=list.map(s=>`<div class="cb-c"><b>${esc(s.title)}</b><span>${esc((OBY[s.org]||{}).name)}</span><div class="row"><button class="btn ghost" data-d="${s.id}">التفاصيل</button>${s.link?`<a class="btn gold" href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">${/برنامج/.test(s.title)?'التقديم':'الاستفادة'}</a>`:''}</div></div>`).join('');
    w.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{ cb.classList.remove('on'); $('#cbFab').style.display=''; go('#/service/'+b.dataset.d); }));
    M.appendChild(w); scroll();
  }
  function open(){ cb.classList.add('on'); $('#cbFab').style.display='none'; if(!opened){ opened=true; bubble('a','مرحبًا بكم في دليل شركاء النجاح. يسرّني مساعدتكم؛ يُرجى وصف مشروعكم أو احتياجكم، وسأرشّح لكم الخدمات والبرامج الأنسب من الدليل.'); S.innerHTML=['أحتاج إلى تمويل لمشروعي','أبحث عن برامج احتضان وتسريع','أرغب في اعتمادات سحابية','لدي نموذج أولي وأرغب في تطويره'].map(x=>`<button type="button">${x}</button>`).join(''); S.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>send(b.textContent))); } setTimeout(()=>I.focus(),50); }
  function close(){ cb.classList.remove('on'); $('#cbFab').style.display=''; }
  async function send(text){
    text=String(text||'').trim(); if(!text||busy) return; busy=true; GO.disabled=true; I.value=''; S.innerHTML=''; bubble('u',text);
    const wait=document.createElement('div'); wait.className='cb-b a'; wait.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'; M.appendChild(wait); scroll();
    let reply='', ids=[], note=false;
    try{
      if(localMode) throw new Error('local');
      const r=await fetch('/api/guide-chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,history:HIST.slice(-6)})});
      if(r.status===429){ wait.remove(); bubble('n','تجاوزتم الحد المسموح به من الأسئلة في الساعة. يُرجى المحاولة لاحقًا أو تصفح الدليل مباشرة.'); busy=false; GO.disabled=false; return; }
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json(); reply=j.reply; ids=j.ids||[];
    }catch(e){
      if(!localMode) note=true; localMode=true; const found=retrieve(text,4); ids=found.map(x=>x.id);
      reply=found.length?'نرشّح لكم الخدمات التالية، وهي الأقرب إلى سؤالكم في الدليل:':'لم نجد في الدليل خدمات مطابقة لهذا السؤال. يُرجى إعادة صياغته بكلمات أخرى مثل «تمويل» أو «احتضان» أو «سحابي»، أو تصفح الجهات والتصنيفات.';
    }
    wait.remove(); bubble('a',reply); cards(ids); if(note) bubble('n','المساعد الذكي غير مفعّل حاليًا؛ وتُعرض نتائج البحث المباشر في الدليل.'); HIST.push({role:'user',text},{role:'assistant',text:reply}); busy=false; GO.disabled=false; I.focus();
  }
  F.addEventListener('submit',e=>{ e.preventDefault(); send(I.value); });
  $('#cbFab').addEventListener('click',open); $('#cbX').addEventListener('click',close);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
})();
})();
</script>
