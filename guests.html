<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل حضور الحفل الختامي — حاضنة ابتكار 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#12103C;--navy2:#1A1852;--gold:#C9A24B;--gold-l:#FBF0DA;--ink:#1A1A2E;--gray:#6B6B80;--line:#E4E4EE;--ok:#1E7D4F;--ok-bg:#E6F4EC;--no:#B3261E;--no-bg:#FBE9E7;}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;background:#F4F4F9;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.hero{width:100%;background:linear-gradient(160deg,#12103C,#1A1852 60%,#2a1d5e);color:#fff;text-align:center;padding:34px 20px 70px;position:relative}
.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#C9A24B,#2C8C8B,#6B3FA0)}
.hero .k{color:#E6C570;font-size:13px;font-family:'Cairo',sans-serif}
.hero h1{text-wrap:balance;font-family:'Cairo',sans-serif;font-size:26px;margin:8px 0 6px;line-height:1.5}
.hero .d{display:inline-block;margin-top:6px;background:rgba(255,255,255,.12);border:1px solid rgba(230,197,112,.5);padding:6px 16px;border-radius:999px;font-size:14px;color:#E6C570;font-weight:600}
.card{width:calc(100% - 32px);max-width:560px;background:#fff;border:1px solid var(--line);border-radius:18px;margin:-44px 16px 24px;padding:26px 22px;position:relative;z-index:2;box-shadow:0 8px 28px rgba(18,16,60,.08)}
.hi{font-size:13px;color:var(--gray)}
.name{font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;color:var(--navy);margin:2px 0}
.proj{font-size:14px;color:var(--ink);margin-bottom:16px}
.proj b{color:var(--navy2)}
.ev{background:#F8F8FC;border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.ev-h{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:8px;letter-spacing:.2px}
.ev-row{display:flex;gap:12px;align-items:flex-start;padding:7px 0}.ev-row+.ev-row{border-top:1px dashed var(--line)}
.ev-t{flex:none;min-width:128px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-weight:800;font-size:12.5px;color:var(--navy);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev-d{font-size:13.5px;line-height:1.7;color:var(--ink,#1F1B4D)}
.ev-loc{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.ev-loc svg{flex:none;margin-top:2px}.ev-lm{font-weight:800;font-size:14.5px;color:var(--navy)}.ev-ls{font-size:12.5px;color:var(--gray);margin-top:2px;line-height:1.7}
@media(max-width:380px){.ev-row{flex-direction:column;gap:4px}.ev-t{min-width:0}}
.details{background:var(--gold-l);border:1px solid #E9D6AB;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.9;color:#5C4315;white-space:pre-wrap;margin-bottom:18px}
.q{font-weight:700;font-size:15px;margin-bottom:10px}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--navy2)}
.btn.yes.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.no.on{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:10px;background:#F7F7FB;color:var(--gray);line-height:1.8}
.status.ok{background:var(--ok-bg);color:var(--ok)}.status.no{background:var(--no-bg);color:var(--no)}
.warn{margin-top:12px;font-size:12.5px;color:#8A6D00}
.err{text-align:center;padding:10px;color:var(--no);line-height:2}
.foot{font-size:12px;color:var(--gray);margin:0 0 24px;text-align:center}
input.f{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;margin-bottom:12px;direction:ltr;text-align:right}
input.f:focus{outline:none;border-color:var(--navy2)}
.lbl{font-size:13px;font-weight:600;margin-bottom:6px}.lbl i{color:var(--no);font-style:normal}
input.f.rt{direction:rtl}.cap{margin-top:12px;font-size:12.5px;color:var(--gray);line-height:1.8}.big{font-size:42px;text-align:center;margin:4px 0}.sec{background:#F7F7FB;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--gray);margin-top:14px;word-break:break-all;line-height:1.7}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--navy2);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6}
.pick{display:block;width:100%;text-align:right;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:14px;cursor:pointer;margin-bottom:8px}
.pick:hover{border-color:var(--navy2)}
.lnk{background:none;border:0;color:var(--navy2);font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;margin-top:14px;padding:0}
.topbar{width:100%;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;direction:rtl}
.topbar .inc{height:46px;display:flex;align-items:center}.topbar .inc img{height:100%;width:auto;display:block}
.topbar .qu{height:52px;display:flex;align-items:center}.topbar .qu img{height:100%;width:auto;display:block}
.topbar .qu .qu-fallback{font-family:'Cairo',sans-serif;font-weight:800;color:var(--navy2);font-size:15px;line-height:1.3;text-align:left}
@media(max-width:560px){.topbar .inc{height:36px}.topbar .qu{height:40px}}
</style>
</head>

function renderDetails(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.replace(/^[\s\u{1F300}-\u{1FAFF}☀-➿️•·\-–]+/u,'').trim()).filter(Boolean);
  const rows=[]; let main='', sub='', other=[];

  lines.forEach((l,i)=>{
    const m = l.match(/^(.+?)\s*(?:\||:)\s*(.+)$/);
    if(/^(المكان|الموقع)\s*[:：]/.test(l)){ main = l.replace(/^(المكان|الموقع)\s*[:：]\s*/,''); const nx=lines[i+1]; if(nx && !hasTime(nx) && !/^(المكان|الموقع)/.test(nx)){ sub = nx; lines[i+1]=''; } }

  });

    <div class="name" style="margin-bottom:4px">تسجيل الحضور</div>
    ${INFO.details?renderDetails(INFO.details):''}
    <div class="proj" style="color:var(--gray);line-height:1.9">${CAT==='invited'?'يسعدنا ويشرفنا حضوركم للحفل الختامي لحاضنة ابتكار في نسختها الخامسة، الرجاء تعبئة البيانات التالية.':'يسعدنا حضوركم، الرجاء تعبئة البيانات التالية.'+(INFO.auto_approve?' ويُؤكَّد حضوركم مباشرةً عند التسجيل'+(INFO.limited?'، والمقاعد محدودة.':'.'):' وسيتم تأكيد حضوركم لاحقًا.')}</div>
    <div class="lbl">الاسم الكامل <i>*</i></div><input class="f rt" id="gName" autocomplete="name">
    <div class="lbl">الجهة</div><input class="f rt" id="gOrg" autocomplete="organization">
    <div class="lbl">المسمى الوظيفي / الصفة</div><input class="f rt" id="gPos">
    <div class="lbl">رقم الجوال <i>*</i></div><input class="f" id="gPhone" type="tel" inputmode="tel" placeholder="05xxxxxxxx" autocomplete="tel">
    <div class="lbl">البريد الإلكتروني <i>*</i></div><input class="f" id="gEmail" type="email" inputmode="email" placeholder="name@example.com" autocomplete="email">
    ${msg?`<div class="status no" style="margin:0 0 12px">${msg}</div>`:''}
    <button class="go" id="gGo">${INFO.auto_approve?'تأكيد الحضور':'إرسال الطلب'}</button>
    ${INFO.deadline?`<div class="warn">⏰ آخر موعد للتسجيل: ${fmtD(INFO.deadline)}</div>`:''}
    <button class="lnk" id="gLk">لدي طلب سابق</button>`;
  document.getElementById('gLk').addEventListener('click', renderLookup);
  const go = document.getElementById('gGo');
  go.addEventListener('click', async ()=>{
    const v = id=>document.getElementById(id).value.trim();
    if(v('gName').length<3) return renderFormKeep('يُرجى كتابة الاسم الكامل.');
    if(v('gPhone').replace(/\D/g,'').length<9) return renderFormKeep('يُرجى إدخال رقم جوال صحيح.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('gEmail'))) return renderFormKeep('يُرجى إدخال بريد إلكتروني صحيح.');
    go.disabled=true; go.textContent='جارٍ الإرسال…';
    const { data, error } = await SB.rpc('guest_register',{p_name:v('gName'),p_org:v('gOrg'),p_position:v('gPos'),p_phone:v('gPhone'),p_email:v('gEmail'),p_cat:CAT});
    if(error||!data){ go.disabled=false; go.textContent=INFO.auto_approve?'تأكيد الحضور':'إرسال الطلب'; return renderFormKeep('تعذّر الإرسال: '+((error&&error.message)||'حاول مرة أخرى')); }
    if(!data.ok){ const m={closed:'انتهى التسجيل.',full:'اكتمل العدد.',name:'الاسم غير صحيح.',phone:'رقم الجوال غير صحيح.',email:'البريد غير صحيح.'}; go.disabled=false; go.textContent=INFO.auto_approve?'تأكيد الحضور':'إرسال الطلب'; if(data.reason==='closed'||data.reason==='full'){ INFO.is_open=data.reason!=='closed'; INFO.is_full=data.reason==='full'; return renderForm(); } return renderFormKeep(m[data.reason]||'تعذّر الإرسال.'); }
    saveToken(data.token); await showStatus();
  });
}
function renderFormKeep(msg){ const keep=['gName','gOrg','gPos','gPhone','gEmail'].map(i=>document.getElementById(i)&&document.getElementById(i).value); renderForm(msg); ['gName','gOrg','gPos','gPhone','gEmail'].forEach((i,k)=>{ const e=document.getElementById(i); if(e&&keep[k]) e.value=keep[k]; }); }

function renderLookup(msg){
  card.innerHTML = `<div class="name" style="margin-bottom:6px">الاطلاع على طلبي</div>
    <div class="proj" style="color:var(--gray);line-height:1.9">أدخل رقم الجوال والبريد الإلكتروني <b>اللذين سجّلت بهما</b>.</div>
    <div class="lbl">رقم الجوال</div><input class="f" id="lkP" type="tel" inputmode="tel" placeholder="05xxxxxxxx">
    <div class="lbl">البريد الإلكتروني</div><input class="f" id="lkE" type="email" inputmode="email">
    ${msg&&typeof msg==='string'?`<div class="status no" style="margin:0 0 12px">${msg}</div>`:''}
    <button class="go" id="lkGo">عرض الطلب</button><button class="lnk" id="lkBack">رجوع</button>`;
  document.getElementById('lkBack').addEventListener('click',()=>renderForm());
  document.getElementById('lkGo').addEventListener('click', async ()=>{
    const b=document.getElementById('lkGo'); b.disabled=true; b.textContent='جارٍ البحث…';
    const { data, error } = await SB.rpc('guest_lookup',{p_phone:document.getElementById('lkP').value,p_email:document.getElementById('lkE').value});
    if(error||!data||!data.ok){ return renderLookup(error?'تعذّر الاتصال، حاول لاحقًا.':'لم نجد طلبًا بهذه البيانات. تأكد من الجوال والبريد المسجّلين.'); }
    saveToken(data.token); await showStatus();
  });
}

async function showStatus(justSent){
  const { data } = await SB.rpc('guest_get',{p_token:TOKEN});
  if(!data||!data.ok) return false;
  INFO = data.info||INFO; setHero(INFO);
  const s = data.status;
  const T = {
    pending:  ['⏳','طلبك قيد المراجعة','تم استلام تسجيلكم، وسيتم تأكيد حضوركم لاحقًا. احتفظوا بالرابط أدناه للعودة إلى هذه الصفحة ومعرفة حالة التسجيل.','status'],
    approved: ['✅','تم تأكيد حضوركم','يسرّنا حضوركم الحفل الختامي. نتطلع للقائكم.','status ok'],
    rejected: ['ℹ️','تعذّر اعتماد الطلب','نشكر اهتمامكم. لم نتمكن من اعتماد طلب الحضور في هذه المرة. للاستفسار تواصلوا مع فريق البرنامج.','status no'],
    cancelled:['✕','تم إلغاء الطلب','تم إلغاء طلب حضوركم بناءً على رغبتكم. للاستفسار تواصلوا مع فريق البرنامج.','status'],
  }[s] || ['','',''];
  card.innerHTML = `<div class="hi">مرحبًا</div><div class="name">${esc(data.name)}</div>${data.org?`<div class="proj">${esc(data.org)}${data.position?' — '+esc(data.position):''}</div>`:''}
    <div class="big">${T[0]}</div><div class="${T[3]}" style="text-align:center;font-size:15px"><b>${T[1]}</b><br>${T[2]}</div>
    ${s==='approved'&&INFO&&INFO.details?`<div style="margin-top:14px">${renderDetails(INFO.details)}</div>`:''}
    ${s==='pending'||s==='approved'?`<div class="sec">رابط طلبك (احتفظ به):<br><span style="direction:ltr;display:inline-block">${esc(own())}</span></div><button class="lnk" id="gCp">نسخ الرابط</button><br><button class="lnk" id="gCancel" style="color:var(--no)">إلغاء ${s==='approved'?'حضوري':'طلبي'}</button>`:''}
    <br><button class="lnk" id="gOther">تسجيل شخص آخر</button>`;
  const cp=document.getElementById('gCp'); if(cp) cp.addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(own()); cp.textContent='تم النسخ ✓'; }catch(e){ prompt('انسخ الرابط',own()); } });
  const cn=document.getElementById('gCancel'); if(cn) cn.addEventListener('click',async()=>{ if(!confirm('هل تريد إلغاء '+(s==='approved'?'حضورك؟':'طلبك؟'))) return; await SB.rpc('guest_cancel',{p_token:TOKEN}); await showStatus(); });
  document.getElementById('gOther').addEventListener('click',()=>{ TOKEN=''; try{ localStorage.removeItem(LS_KEY); }catch(e){} history.replaceState(null,'',location.pathname); renderForm(); });
  return true;
}
init();
</script>
</body>
</html>
